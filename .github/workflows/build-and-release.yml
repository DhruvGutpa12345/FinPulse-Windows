name: Build, Package & Release FinPulse Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Windows Applications (.exe, .msi, .msix)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild and Windows SDK Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install WiX Toolset for .MSI Generation
        run: |
          dotnet tool install --global wix --version 5.0.2

      - name: Run Financial Mathematics Unit Tests
        run: |
          dotnet test tests/FinPulse.Tests/FinPulse.Tests.csproj --configuration Release --verbosity normal

      - name: Restore NuGet Packages for Solution
        run: |
          nuget restore FinPulse.sln

      - name: Publish WinUI 3 Application via MSBuild
        run: |
          msbuild src\FinPulse\FinPulse.csproj /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:PublishDir=..\..\publish\win-x64\ /t:Publish /v:detailed

      - name: Setup Code Signing Certificate
        shell: powershell
        run: |
          if ("${{ secrets.CODE_SIGNING_PFX_BASE64 }}" -ne "") {
            Write-Host "Using production Code Signing Certificate from repository secrets..."
            [System.IO.File]::WriteAllBytes("cert.pfx", [System.Convert]::FromBase64String("${{ secrets.CODE_SIGNING_PFX_BASE64 }}"))
            echo "PFX_PASS=${{ secrets.CODE_SIGNING_PASSWORD }}" >> $env:GITHUB_ENV
          } else {
            Write-Host "Using repository static development certificate (FinPulseDevCert.pfx)..."
            Copy-Item -Path "packaging/signing/FinPulseDevCert.pfx" -Destination "cert.pfx"
            Copy-Item -Path "packaging/signing/FinPulseDevCert.cer" -Destination "cert.cer"
            echo "PFX_PASS=FinPulsePass123!" >> $env:GITHUB_ENV
          }

      - name: Sign Standalone Executable (.exe)
        shell: powershell
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          Write-Host "Signing executable using $signtool..."
          & $signtool sign /f "cert.pfx" /p $env:PFX_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v "publish/win-x64/FinPulse.exe"

      - name: Build MSI Installer Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          wix build -arch x64 -o dist/FinPulse-Setup-x64.msi packaging/msi/Product.wxs -b publish/win-x64

      - name: Sign MSI Installer Package
        shell: powershell
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          if (Test-Path "dist/FinPulse-Setup-x64.msi") {
            & $signtool sign /f "cert.pfx" /p $env:PFX_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v "dist/FinPulse-Setup-x64.msi"
          }

      - name: Create MSIX Package (.msix)
        shell: powershell
        run: |
          $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Path "msix_staging" -Force
          Copy-Item -Path "publish/win-x64/*" -Destination "msix_staging" -Recurse
          Copy-Item -Path "packaging/msix/AppxManifest.xml" -Destination "msix_staging/AppxManifest.xml"
          Copy-Item -Path "src/FinPulse/Assets" -Destination "msix_staging/Assets" -Recurse -Force
          
          & $makeappx pack /d "msix_staging" /p "dist/FinPulse-x64.msix" /o /v

      - name: Sign MSIX Package
        shell: powershell
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          & $signtool sign /f "cert.pfx" /p $env:PFX_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v "dist/FinPulse-x64.msix"

      - name: Package Standalone Portable (.zip with .exe)
        shell: powershell
        run: |
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "dist/FinPulse-Portable-x64.zip" -Force

      - name: Build Standalone Launcher (.exe) and Copy Distribution Scripts
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          & $csc /target:winexe /r:System.Windows.Forms.dll "/out:dist\FinPulse.exe" "packaging\launcher\Launcher.cs"
          & $signtool sign /f "cert.pfx" /p $env:PFX_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v "dist\FinPulse.exe"
          Copy-Item -Path "packaging/scripts/Install-RunAsAdmin.bat" -Destination "dist/Install-RunAsAdmin.bat" -Force
          Copy-Item -Path "packaging/scripts/Install-All.ps1" -Destination "dist/Install-All.ps1" -Force
          Copy-Item -Path "cert.cer" -Destination "dist/cert.cer" -Force
          Copy-Item -Path "packaging/signing/FinPulseDevCert.cer" -Destination "dist/FinPulseDevCert.cer" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinPulse-Windows-Packages
          path: |
            dist/*
            cert.cer

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FinPulse Windows v1.0.0"
          files: |
            dist/FinPulse-Setup-x64.msi
            dist/FinPulse-x64.msix
            dist/FinPulse-Portable-x64.zip
            dist/FinPulse.exe
            dist/Install-RunAsAdmin.bat
            dist/Install-All.ps1
            dist/cert.cer
            dist/FinPulseDevCert.cer
          draft: false
          prerelease: false
          generate_release_notes: true
